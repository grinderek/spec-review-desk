version: 1
feature: Implement reviewed changes and expose their verification results
scenarios:
  - id: display-verification-result
    scenario: Show the actual verification result for a reviewed contract
    cases:
      - name: passing run
        status: passed
        outcome: done
        totals:
          passed: 1
          failed: 0
          other: 0
      - name: failing run
        status: failed
        outcome: failed
        totals:
          passed: 0
          failed: 1
          other: 0
    given:
      - ScenarioDiscovered: {}
      - VerificationPrepared:
          status: $status
    when:
      RunVerification: {}
    then:
      stream: verification
      bind:
        run: response.body.state.runId
        source: response.body.state.sourceHash
      events:
        - VerificationSourceCaptured:
            runId: $run
        - ExecutionQueued:
            request:
              id: $run
              role: verification
        - ExecutionAttemptRequested:
            runId: $run
            attempt:
              sourceHash: $source
        - ExecutionAttemptObserved:
            runId: $run
        - ExecutionReceiptAccepted:
            runId: $run
        - VerificationReportAccepted:
            runId: $run
            sourceUnchanged: true
            report:
              totals: $totals
        - ExecutionSettled:
            runId: $run
            outcome: $outcome
      response:
        status: 202
      reads:
        - path: $runner
          response:
            status: 200
            body:
              state:
                execution: local
                running: false
                stale: false
                outcome: $outcome
                result:
                  totals: $totals
                  scenarios:
                    subject.desk.yaml::Subject contract:
                      status: $status
