version: 1
feature: Review history survives storage changes and refuses corrupt state
scenarios:
  - id: recover-all-approval-state
    scenario: Recover scenario, phrase and change approvals from history
    given:
      - ScenarioDiscovered: {}
      - PhraseProposed: {}
      - ScenarioApproved: { key: $key, hash: $hash, commit: $head, at: $at }
      - PhraseApproved: { key: $phrase, hash: $phraseHash, at: $at }
      - ChangeApprovalRecorded: { at: $at, commit: $head }
      - ReviewProjectionLost: {}
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - effective: { status: approved }
          phrases:
            - effective: { status: approved }
          review: { approved_at: $at, approved_commit: $head }
          readiness: { ready: true, reasons: [] }

  - id: preserve-special-key
    scenario: Preserve review keys containing punctuation and Unicode
    given:
      - ScenarioDiscovered: { file: 'features/quoted: #1 — ünïcode.desk.yaml' }
      - ScenarioApproved: { key: $key, hash: $hash, commit: $head, at: $at }
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - key: $key
                  effective: { status: approved }
          review:
            scenarios:
              $key: { status: approved, text_hash: $hash, approved_commit: $head, at: $at }

  - id: reject-invalid-projection
    scenario: Render an invalid review projection as a blocking error
    cases:
      - { name: unsupported version, source: 'version: 7' }
      - { name: malformed YAML, source: 'version: [unclosed' }
    given:
      - ScenarioDiscovered: {}
      - ReviewProjectionWritten: { source: $source }
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          readiness: { ready: false, reasons: [review.yaml is invalid, 1 scenario not approved] }

  - id: preserve-external-metadata
    scenario: Preserve external metadata when recording a phrase approval
    given:
      - ScenarioDiscovered: {}
      - PhraseProposed: {}
      - ScenarioApproved: { key: $key, hash: $hash, at: $at }
      - ProjectionMetadataEdited: { session: external-session }
    when:
      ApprovePhrase: { key: $phrase }
    then:
      events:
        - PhraseApproved: { key: $phrase, hash: $phraseHash }
      response: { status: 200, body: { ok: true } }
      reads:
        - path: $change
          response:
            status: 200
            body:
              review: { agent_session: external-session }
              features:
                - scenarios:
                    - effective: { status: approved }

  - id: replay-concurrent-history
    scenario: Preserve both approvals when prior events arrive concurrently
    given:
      - ScenarioDiscovered: {}
      - ConcurrentScenarioApprovalsDelivered: {}
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - key: $key
                  effective: { status: approved }
                - key: $otherKey
                  effective: { status: approved }
          readiness: { ready: true, reasons: [] }

  - id: journal-is-authoritative
    scenario: Keep journalled approval despite a manual projection edit
    given:
      - ScenarioDiscovered: {}
      - ScenarioApproved: { key: $key, hash: $hash, at: $at }
      - ProjectionScenarioApprovalEdited: {}
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - effective: { status: approved }

  - id: preserve-other-review-state
    scenario: Preserve discussion and decision contracts across a review update
    cases:
      - name: thread decision and escaped key
        source: { kind: thread, id: t_fixture }
        scope: { kind: scenario, key: 'features/x.feature::It''s "quoted": #1 — ünïcode' }
        agentId: age_basis
        domains: []
      - name: initiative research decision
        source: { kind: run, run: r_00000001, agent: research }
        scope: { kind: change }
        agentId: fetch-domains
        domains: [docs.stripe.com]
    given:
      - ScenarioDiscovered: {}
      - PhraseProposed: {}
      - ReviewThreadOpened:
          id: t_fixture
          status: answered
          messages:
            - { role: owner, at: $at, text: Why?, note: null, patch: null }
            - role: agent
              at: $at
              text: Two readings.
              note: null
              patch: { diff: patch-data, state: applied, commit: abc1234, error: null, files: [features/x.feature] }
              decision_ids: [d_fixture]
              resolves: []
              invalid: { issues: [field is invalid], raw: '{}' }
      - DecisionRaised:
          agent_id: $agentId
          source: $source
          scope: $scope
          requested_domains: $domains
          options:
            - { id: business, label: Business hours, consequence: Weekends do not count. }
            - { id: calendar, label: Calendar hours, consequence: Weekends count. }
          recommended: business
    when:
      ApprovePhrase: { key: $phrase }
    then:
      events:
        - PhraseApproved: { key: $phrase, hash: $phraseHash }
      response: { status: 200, body: { ok: true } }
      reads:
        - path: $change
          response:
            status: 200
            body:
              review:
                threads:
                  - id: t_fixture
                    status: answered
                    messages:
                      - { role: owner, text: Why? }
                      - role: agent
                        text: Two readings.
                        patch: { state: applied, commit: abc1234, files: [features/x.feature] }
                        decision_ids: [d_fixture]
                        resolves: []
                        invalid: { issues: [field is invalid], raw: '{}' }
                decisions:
                  - id: d_fixture
                    agent_id: $agentId
                    source: $source
                    scope: $scope
                    requested_domains: $domains
                    recommended: business
                    status: open
                    choice: null
                    recorded: null
                    dismissed: null
                    options:
                      - { id: business, label: Business hours, consequence: Weekends do not count. }
                      - { id: calendar, label: Calendar hours, consequence: Weekends count. }

  - id: import-legacy-review-state
    scenario: Keep existing approvals when extending a legacy review history
    cases:
      - { name: original YAML review, journalled: false }
      - { name: scenario-only journal, journalled: true }
    given:
      - ScenarioDiscovered: {}
      - PhraseProposed: {}
      - LegacyReviewImported: { journalled: $journalled }
    when:
      ApprovePhrase: { key: $phrase }
    then:
      events:
        - PhraseApproved: { key: $phrase, hash: $phraseHash }
      response: { status: 200, body: { ok: true } }
      reads:
        - path: $change
          response:
            status: 200
            body:
              review: { approved_at: $at, approved_commit: $head }
              features:
                - scenarios:
                    - effective: { status: approved }
              phrases:
                - effective: { status: approved }
              readiness: { ready: true, reasons: [] }
