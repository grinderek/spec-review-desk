version: 1
feature: Scenario approval follows the reviewed contract
scenarios:
  - id: approve-current-contract
    scenario: Approve the current scenario contract
    given:
      - ScenarioDiscovered: {}
    when:
      ApproveScenario: { key: $key }
    then:
      events:
        - ScenarioApproved: { key: $key, hash: $hash, commit: $head }
      response: { status: 200, body: { ok: true } }

  - id: revoke-approval
    scenario: Revoke a scenario approval
    given:
      - ScenarioDiscovered: {}
      - ScenarioApproved: { key: $key, hash: $hash, commit: $head, at: $at }
    when:
      RevokeScenarioApproval: { key: $key }
    then:
      events:
        - ScenarioReviewRemoved: { key: $key }
      response: { status: 200, body: { ok: true } }

  - id: unchanged-contract
    scenario: Keep approval while the contract is unchanged
    given:
      - ScenarioDiscovered: {}
      - ScenarioApproved: { key: $key, hash: $hash, commit: $head, at: $at }
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - effective: { status: approved, changedSinceApproval: false, approvedCommit: $head }

  - id: changed-contract
    scenario: Require approval after the contract changes
    given:
      - ScenarioDiscovered: {}
      - ScenarioApproved: { key: $key, hash: $hash, commit: $head, at: $at }
      - ScenarioRevised: { status: 201 }
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - effective: { status: pending, changedSinceApproval: true, approvedCommit: $head }
          readiness: { ready: false }

  - id: recover-projection
    scenario: Recover scenario approval from events after projection loss
    given:
      - ScenarioDiscovered: {}
      - ScenarioApproved: { key: $key, hash: $hash, commit: $head, at: $at }
      - ReviewProjectionLost: {}
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - effective: { status: approved, changedSinceApproval: false, approvedCommit: $head }

  - id: reject-unknown-scenario
    scenario: Reject approval of an unknown scenario
    given:
      - ScenarioDiscovered: {}
    when:
      ApproveScenario: { key: missing }
    then:
      events: []
      response: { status: 404, body: { error: { code: unknown_scenario } } }

  - id: reject-archived-change
    scenario: Reject writes to an archived change
    cases:
      - { name: approve scenario, operation: scenarios/approve, payload: { key: $key } }
      - { name: revoke scenario, operation: scenarios/revoke, payload: { key: $key } }
      - { name: request changes, operation: scenarios/request-changes, payload: { key: $key, reason: Explain. } }
      - { name: approve phrase, operation: phrases/approve, payload: { key: missing } }
      - { name: revoke phrase, operation: phrases/revoke, payload: { key: missing } }
      - { name: approve change, operation: approval, payload: {} }
      - { name: drop orphan, operation: orphans/drop, payload: { section: scenarios, key: old } }
      - { name: reattach orphan, operation: orphans/reattach, payload: { section: scenarios, key: old, to: missing } }
    given:
      - ScenarioDiscovered: {}
      - ChangeArchived: {}
    when:
      HttpRequest: { method: POST, path: '$change/$operation', body: $payload }
    then:
      events: []
      response: { status: 409, body: { error: { code: archived } } }

  - id: unreviewed-contract
    scenario: Leave an unreviewed scenario pending
    given:
      - ScenarioDiscovered: {}
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - effective: { status: pending, changedSinceApproval: false, approvedCommit: null }
          review: { version: 1, agent_session: null, approved_at: null, approved_commit: null, threads: [], decisions: [], apply_runs: [] }

  - id: preserve-changes-requested
    scenario: Keep requested changes while the contract is unchanged
    given:
      - ScenarioDiscovered: {}
      - ScenarioChangesRequested: { key: $key, hash: $hash, at: $at }
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - effective: { status: changes_requested, changedSinceApproval: false, approvedCommit: null }

  - id: formatting-preserves-approval
    scenario: Preserve approval after YAML formatting changes
    given:
      - ScenarioDiscovered: {}
      - ScenarioApproved: { key: $key, hash: $hash, commit: $head, at: $at }
      - ScenarioReformatted: {}
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features:
            - scenarios:
                - effective: { status: approved, changedSinceApproval: false, approvedCommit: $head }
