version: 1
feature: Desk rejects ambiguous or unsupported contract structure
scenarios:
  - id: reject-two-commands
    scenario: Reject a contract containing two commands
    given:
      - ScenarioDiscovered: {}
      - ContractSourceWritten:
          source: |
            version: 1
            feature: Invalid
            scenarios:
              - id: subject
                scenario: Subject contract
                given: []
                when: { FirstCommand: {}, SecondCommand: {} }
                then: { events: [], response: { status: 200 } }
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features: []
          errors: [{ file: features/subject.desk.yaml }]
          readiness: { ready: false }

  - id: reject-unknown-fields
    scenario: Reject an unknown contract field
    given:
      - ScenarioDiscovered: {}
      - ContractSourceWritten:
          source: |
            version: 1
            feature: Invalid
            scenarios:
              - id: subject
                scenario: Subject contract
                given: []
                when: { Inspect: {} }
                typo: ignored
                then: { events: [], response: { status: 200 } }
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features: []
          errors: [{ file: features/subject.desk.yaml }]
          readiness: { ready: false }

  - id: reject-duplicate-yaml-keys
    scenario: Reject duplicate YAML keys
    given:
      - ScenarioDiscovered: {}
      - ContractSourceWritten:
          source: |
            version: 1
            version: 1
            feature: Invalid
            scenarios: []
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          features: []
          errors: [{ file: features/subject.desk.yaml }]
          readiness: { ready: false }
