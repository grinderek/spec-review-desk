version: 1
feature: Review views expose the same obligations and history as the owner commands
scenarios:
  - id: display-legacy-review
    scenario: Display legacy scenarios, phrase usage and owner decision provenance
    given:
      - ScenarioDiscovered: {}
      - GherkinReviewDiscovered: {}
    when:
      ReadChange: {}
    then:
      events: []
      response:
        status: 200
        body:
          relDir: openspec/changes/subject
          features:
            - scenarios:
                - title: The founder's reply resolves a waiting thread
                  effective: { status: pending }
                  decisions: [{ date: '2026-09-23', commit: $head }]
                - title: A waiting thread is weighted by its age
                  kind: Scenario Outline
                  effective: { status: pending }
          phrases:
            - { kind: extension, usedBy: 0 }
            - { kind: phrase, usedBy: 2 }
            - { kind: phrase, usedBy: 1 }
          joinKey: { ok: true }
          readiness: { ready: false, reasons: [2 scenarios not approved, 3 phrases not approved] }
          docs:
            proposal: |
              ## Why

              Threads wait on the founder.

  - id: list-review-obligations
    scenario: List owner obligations and identify a decision whose scenario disappeared
    given:
      - ScenarioDiscovered: {}
      - DecisionRaised: { id: d_00000001, scope: { kind: scenario, key: $key }, blocking: true }
      - DecisionRaised: { id: d_00000002, scope: { kind: scenario, key: gone }, blocking: false }
      - DecisionLogWritten:
          source: |
            # Owner decisions — subject

            ## 2026-10-01 — Ship behind a flag?
            Decision: —
            Note: Yes.
            Source: owner · d_00000003
    when:
      ReadChangeSummary: {}
    then:
      events: []
      response:
        status: 200
        body:
          repos:
            - worktrees:
                - changes:
                    - { name: subject, approved: 0, total: 1, phrasesTotal: 0, openThreads: 0, openDecisions: 2, blockingDecisions: 1, ready: false }
      reads:
        - path: $change
          bind: { decisionDocument: response.body.docs.decisions }
          response:
            status: 200
            body:
              decisions:
                - { id: d_00000001, orphaned: false }
                - { id: d_00000002, orphaned: true }
              decisionLog:
                - { date: '2026-10-01', question: Ship behind a flag?, decision: '', note: Yes., source: owner · d_00000003, id: d_00000003 }
              readiness: { reasons: [1 scenario not approved, 1 blocking decision open] }
