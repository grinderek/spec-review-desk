# Run the Desk against its own repository and executable DSL corpus.
port: 4600
hubRoot: .
repos:
  - { name: desk, path: . }
model: gpt-6.1-sol
reasoningEffort: high
agents:
  planner: { model: gpt-6-astra, reasoningEffort: high }
  reviewer: { reasoningEffort: medium }
codexBin: codex
initiativeBase: main
sandbox:
  auth: chatgpt
runners:
  desk:
    execution: local
    worktree: .
    command: [npm, run, test:spec]
    watch: [server, scripts, features]
    applyAllowedTools: [Read, Grep, Glob, Edit, Write, "Bash(npm run test:spec:*)", "Bash(npm test:*)", "Bash(npm run test:legacy:*)", "Bash(npm run test:technical:*)", "Bash(npm run typecheck:*)", "Bash(git status:*)", "Bash(git diff:*)", "Bash(git add:*)", "Bash(git commit:*)"]
