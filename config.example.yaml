port: 4600
# Relative to this file. Use the repository root for one repo, or a parent for several.
hubRoot: .
repos:
  - { name: project, path: . }
  # Multi-repo example: [{ name: backend, path: backend }, { name: frontend, path: frontend }]
# Optional product catalog. Repo references use names declared above; supporting paths
# resolve from hubRoot. A catalog entry does not configure a combined verification run.
# products:
#   - name: product
#     title: My product
#     description: One product, several independently versioned components.
#     components:
#       - { name: api, title: API, role: Public API, repo: project }
#       - { name: tools, title: Tools, role: Load generation, path: tools }
model: gpt-6.1-sol
reasoningEffort: high
agents:
  planner: { model: gpt-6.1-sol, reasoningEffort: high }
  reviewer: { reasoningEffort: medium }
routing:
  enabled: false
  endpoint: http://127.0.0.1:8009
  roles: [research, apply]
  timeoutMs: 5000
  minLunaProbability: 0.55
codexBin: codex
# Any Git ref; HEAD works without requiring a branch named main, master or staging.
initiativeBase: HEAD
commitTrailer: "Co-Authored-By: Codex <noreply@openai.com>"
questionTimeoutMinutes: 10
sandbox:
  auth: chatgpt
  authVolume: spec-review-codex-auth
  envFile: .env
  timeoutMinutes: 30
# Verification is optional. Local runners need no Docker; use a command that writes
# Desk envelopes to DESK_RESULT_FILE, or Cucumber messages to the {resultFile} argument.
# runners:
#   project:
#     execution: local
#     worktree: .
#     command: [bin/cucumber, --format, message, --out, '{resultFile}']
#     watch: [features, src]
#     # Optional independently versioned inputs exercised by the same command:
#     sources: [{ name: frontend, path: ../frontend }]
#     # Apply automatically gets the product components and this verification command.
#     # Optional extra exact commands, called by name rather than arbitrary shell:
#     applyChecks:
#       - { name: prepare, command: [npm, run, environment:up], timeoutMinutes: 45 }
#     # applyAllowedTools is optional. Defaults allow scoped edits and local Git commits.
# For a container runner, set execution: compose and add:
#     compose:
#       project: project-specs
#       files: [compose.yaml, compose.specs.yaml] # relative to this config file
#       service: app
