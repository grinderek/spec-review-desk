port: 4600
# Relative to this file. Use the repository root for one repo, or a parent for several.
hubRoot: .
repos:
  - { name: project, path: . }
  # Multi-repo example: [{ name: backend, path: backend }, { name: frontend, path: frontend }]
model: gpt-6.1-sol
reasoningEffort: high
agents:
  planner: { model: gpt-6.1-sol, reasoningEffort: high }
  reviewer: { reasoningEffort: medium }
routing:
  enabled: false
  endpoint: http://127.0.0.1:8009
  roles: [research, apply]
  timeoutMs: 5000
  minLunaProbability: 0.55
codexBin: codex
# Any Git ref; HEAD works without requiring a branch named main, master or staging.
initiativeBase: HEAD
commitTrailer: "Co-Authored-By: Codex <noreply@openai.com>"
questionTimeoutMinutes: 10
sandbox:
  auth: chatgpt
  authVolume: spec-review-codex-auth
  envFile: .env
  timeoutMinutes: 30
# Verification is optional. Local runners need no Docker; use a command that writes
# Desk or Cucumber message envelopes to .spec-review/last-run.ndjson in its worktree.
# runners:
#   project:
#     execution: local
#     worktree: .
#     command: [bin/cucumber, --format, message, --out, .spec-review/last-run.ndjson]
#     watch: [features, src]
#     applyAllowedTools: [Read, Grep, Glob, Edit, Write, "Bash(git status:*)", "Bash(git diff:*)"]
# For a container runner, set execution: compose and add:
#     compose:
#       project: project-specs
#       files: [compose.yaml, compose.specs.yaml] # relative to this config file
#       service: app
